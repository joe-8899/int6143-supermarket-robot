name: Publish INT6143 demo with expiry
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 2027-01-01 00:07、00:17 及 2027-01-02 00:07 北京时间。
    - cron: '7 16 31 12 *'
    - cron: '17 16 31 12 *'
    - cron: '7 16 1 1 *'
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Select current or expired page
        shell: bash
        run: |
          mkdir -p _site
          if [[ "$(date -u +%Y%m%d%H%M)" -ge 202612311600 ]]; then
            cp expired.html _site/index.html
            touch _site/.nojekyll
          else
            cp index.html style.css ui.css layout.js app.js storeData.js scene3d.js instacart.js sensorAdapter.js favicon.svg expired.html .nojekyll _site/
            cp -R vendor _site/vendor
            cp -R public _site/public
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
